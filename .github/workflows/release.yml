# pluvian release — publish @erkos/pluvian to npm + the VS Code extension
# to the Marketplace, on a vX.Y.Z tag.
#
# npm uses Trusted Publishing (OIDC) — NO stored NPM_TOKEN. The GitHub
# Actions OIDC token is exchanged for a short-lived npm publish token at
# publish time. Requires the Trusted Publisher to be configured on npmjs.com:
#   repository owner = erkos-hq, name = pluvian, workflow = release.yml
# (see .claude/skills/pluvian-release/SKILL.md — a mismatch surfaces only at
# publish time as ENEEDAUTH).
#
# The extension publishes with VSCE_PAT (Marketplace has no OIDC flow yet —
# and note global-scope PATs are deprecated 2027-01-27; rotate via the
# dispatchable publisher-verify.yml workflow when the time comes).
#
# The repo is PUBLIC on GitHub → `--provenance` works (sigstore attestation
# on the npm page). This was E422-blocked on the old private GitLab repo.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Correctness gate — mirrors ci.yml's `test` job. publish runs ONLY after
  # this passes, so a tag pushed with a failing check does NOT ship to npm.
  # (Security scans — audit/semgrep/gitleaks — run on every push to main and
  # PR via ci.yml; a tag points at an already-merged, already-scanned commit,
  # so they're not re-run here. ci.yml does not fire on tags.)
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:integration
      - run: npm run coverage
      - run: npm run check-docs

  publish:
    needs: [gate]
    runs-on: ubuntu-latest
    # REQUIRED for npm trusted publishing (OIDC) — without `id-token: write`
    # the OIDC token isn't issued and `npm publish` fails auth.
    permissions:
      contents: read
      id-token: write
    # No `environment:` — keeps the OIDC claim matching the simplest npm
    # trusted-publisher config (owner + repo + workflow, no environment pin).
    # Add `environment: release` only if you also pin it on npmjs.com AND want
    # environment-scoped protection rules / secrets.
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 → npm 11.x. Trusted publishing (the OIDC → publish-token
          # exchange) REQUIRES npm CLI ≥ 11.5.1; Node 20 ships npm 10.x, which
          # is too old — the exchange silently fails and the PUT goes anonymous
          # → 404 "not in this registry". (Provenance signing still worked on
          # Node 20 because sigstore uses the GitHub OIDC token directly, not
          # the npm publish token — masking the failure.)
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      # Public repo → sigstore provenance attestation lands on the npm page.
      - run: npm publish --access public --provenance

  # VS Code Marketplace — the extension face of the same engine (spec 11
  # P3). Lockstep with the npm publish: same tag, same version, runs in
  # parallel (independent targets; both gated). The staged-closure VSIX
  # (scripts/package.mjs) is packaged + smoke-tested here, then uploaded
  # from inside the staged tree via `vsce publish --no-dependencies`.
  publish-extension:
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the VSIX to the GitHub release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            packages/cli/package-lock.json
            packages/vscode/package-lock.json
      # Fail fast on credential problems (rotation, deprecation) before
      # any heavy work — org-scoped-vs-global PAT verdict lands here too.
      - name: Verify marketplace credentials
        run: npx --yes @vscode/vsce@4 verify-pat erkos
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Verify Open VSX credentials
        run: npx --yes ovsx@latest verify-pat erkos
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      # Engine first: the file:../cli link resolves deps + types from it.
      - name: Install + build engine package
        run: |
          npm install --no-audit --no-fund
          npm run build
        working-directory: packages/cli
      - name: Package + smoke the extension
        run: |
          npm install --no-audit --no-fund
          npm run package
          npm run smoke
        working-directory: packages/vscode
      - name: Publish to the Marketplace
        run: npm run publish
        working-directory: packages/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      # Open VSX (Cursor / Windsurf / VSCodium reach): publishes the SAME
      # prebuilt VSIX — never a repackaged one (the --no-dependencies
      # lesson). ovsx takes the file path directly.
      - name: Publish to Open VSX
        run: |
          vsix="pluvian-$(node -p 'require("./package.json").version').vsix"
          npx --yes ovsx@latest publish "$vsix"
        working-directory: packages/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      # Best-effort side-loading artifact on the GitHub release.
      - name: Attach VSIX to the GitHub release
        run: |
          vsix="pluvian-$(node -p 'require("./package.json").version').vsix"
          gh release upload "$GITHUB_REF_NAME" "$vsix" --clobber ||
            gh release create "$GITHUB_REF_NAME" --generate-notes "$vsix"
        working-directory: packages/vscode
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
