# One-off: publish the VSIX from an existing GitHub release to Open VSX.
# Used when the release was tagged before the Open VSX pipeline existed.
name: ovsx-publish-existing

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.4.0)'
        required: true
        default: 'v2.4.0'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Download VSIX from release
        run: |
          gh release download ${{ inputs.tag }} --repo erkos-hq/pluvian --pattern '*.vsix' --dir /tmp
          ls -la /tmp/*.vsix
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to Open VSX
        run: |
          for vsix in /tmp/*.vsix; do
            npx --yes ovsx@latest publish "$vsix" -p "$OVSX_PAT"
          done
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
